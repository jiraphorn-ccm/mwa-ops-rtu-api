version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        json_tags_case_style: "snake"
        output_models_file_name: "models.go"
        output_db_file_name: "db.go"
        output_querier_file_name: "querier.go"
        rename:
          rtu_panel: "Panel"
          rtu_device_model: "DeviceModel"
          rtu_panel_device: "PanelDevice"
          rtu_calibration_instrument: "CalibrationInstrument"
          rtu_calibration: "Calibration"
          rtu_calibration_reading: "CalibrationReading"
          rtu_panel_image: "PanelImage"
          rtu_engineer: "Engineer"
          rtu_checklist_item: "ChecklistItem"
          rtu_work_order: "WorkOrder"
          rtu_work_order_round: "WorkOrderRound"
          rtu_work_order_activity_log: "WorkOrderActivityLog"
          rtu_wo_approval: "WoApproval"
          rtu_pm_report: "PmReport"
          rtu_checklist_result: "ChecklistResult"
          rtu_pm_ground_test: "PmGroundTest"
          rtu_pm_power_test: "PmPowerTest"
          rtu_pm_power_test_point: "PmPowerTestPoint"
          rtu_cm_report: "CmReport"
          rtu_attachment: "Attachment"
          rtu_notification: "Notification"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "github.com/rtu-api/internal/httpx.Date"
          - db_type: "date"
            nullable: true
            go_type:
              import: "github.com/rtu-api/internal/httpx"
              type: "Date"
              pointer: true
